services:
  - type: web
    name: clearflow-api
    runtime: docker
    repo: https://github.com/gerardobirkhofer-lab/clearflow-backend
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clearflow-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: FRONTEND_URL
        value: "https://clearflow-web.vercel.app"
      - key: REDIS_URL
        value: "redis://localhost:6379/0"
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: clearflow-db
    databaseName: clearflow
    user: clearflow
    plan: free
